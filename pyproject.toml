[project]
name = "transcrb"
version = "0.1.4"
description = "Push-to-talk dictation tray app for Windows with local Whisper transcription"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "faster-whisper>=1.1.0",
    "ctranslate2>=4.4.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26,<3",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "huggingface-hub>=0.24",
    "socksio>=1.0",
    "loguru>=0.7",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.0; sys_platform == 'win32'",
]

[project.scripts]
transcrb = "transcrb.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pyinstaller>=6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcrb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
