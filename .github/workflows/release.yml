name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          } else {
            $version = "${{ inputs.version }}"
            if (-not $version) { $version = "0.0.0-dev" }
          }
          Write-Host "Resolved version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Patch __version__
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $path = "src/transcrb/__init__.py"
          $content = (Get-Content $path -Raw) -replace '__version__ = ".*"', ('__version__ = "{0}"' -f $v)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $content, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "--- $path ---"
          Get-Content $path

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build PyInstaller bundle
        run: uv run pyinstaller --clean packaging/transcrb.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Pack portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "dist\WinWhisp-$v-portable.zip"
          Compress-Archive -Path dist\winwhisp\* -DestinationPath $out -Force
          Get-Item $out | Format-Table Name, Length, LastWriteTime

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winwhisp-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/*.zip
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Установка

            **Скачайте `WinWhisp-${{ steps.ver.outputs.version }}-setup.exe`** и запустите его.

            Windows SmartScreen может предупредить о неизвестном издателе — это нормально для неподписанных сборок:
            нажмите **«Подробнее» → «Выполнить в любом случае»**.

            Альтернатива: portable-сборка `WinWhisp-${{ steps.ver.outputs.version }}-portable.zip` — распакуйте и запустите `winwhisp.exe`.

            ## Системные требования

            - Windows 10/11 x64
            - NVIDIA GPU с CUDA 12.x (рекомендуется ≥ 6 ГБ VRAM для large-v3)
            - При первом запуске WinWhisp сам скачает выбранную модель Whisper
