name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          } else {
            $version = "${{ inputs.version }}"
            if (-not $version) { $version = "0.0.0-dev" }
          }
          Write-Host "Resolved version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Patch __version__
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $path = "src/transcrb/__init__.py"
          $content = (Get-Content $path -Raw) -replace '__version__ = ".*"', ('__version__ = "{0}"' -f $v)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $content, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "--- $path ---"
          Get-Content $path

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in archive" }
          $target = "resources/bin"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $exe.FullName (Join-Path $target "ffmpeg.exe") -Force
          Get-Item (Join-Path $target "ffmpeg.exe") | Format-Table Name, Length, LastWriteTime

      - name: Build PyInstaller bundle
        run: uv run pyinstaller --clean packaging/transcrb.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Pack portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "dist\WinWhisp-$v-portable.zip"
          Compress-Archive -Path dist\winwhisp\* -DestinationPath $out -Force
          Get-Item $out | Format-Table Name, Length, LastWriteTime

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winwhisp-${{ steps.ver.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $changelogPath = "CHANGELOG.md"
          if (-not (Test-Path $changelogPath)) { throw "CHANGELOG.md not found" }
          $content = Get-Content $changelogPath -Raw
          $escaped = [regex]::Escape($v)
          $pattern = "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md has no section for [$v]. Add it before tagging."
          }
          $changes = $match.Groups[1].Value.Trim()
          $template = @(
            '## Изменения',
            '',
            '{1}',
            '',
            '## Установка',
            '',
            '**Скачайте `WinWhisp-{0}-setup.exe`** и запустите его.',
            '',
            'Windows SmartScreen может предупредить о неизвестном издателе — это нормально для неподписанных сборок:',
            'нажмите **«Подробнее» → «Выполнить в любом случае»**.',
            '',
            'Альтернатива: portable-сборка `WinWhisp-{0}-portable.zip` — распакуйте и запустите `winwhisp.exe`.'
          ) -join "`r`n"
          $body = $template -f $v, $changes
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          [System.IO.File]::WriteAllText("$PWD\dist\release_notes.md", $body, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "--- release_notes.md ---"
          Get-Content dist\release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/*.zip
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          body_path: dist/release_notes.md
